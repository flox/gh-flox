name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4


      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2


      - name: Build
        run: flox activate -- make local

      - name: Test export produces valid JSON
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPOS_GITHUB_TOKEN }}
        run: flox activate -- ./gh-flox export | jq . > /dev/null
